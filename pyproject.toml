[project]
name = "sample-aks-entra-agent-id"
version = "0.1.0"
description = "Multi-agent meal planning PoC for AKS and Microsoft Entra"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-core>=1.13.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry-exporter>=1.0.0b35",
  "azure-search-documents>=11.6.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "mcp>=1.26.0,<2",
  "openai>=1.61.0,<3",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-sdk>=1.29.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pyjwt[crypto]>=2.10.0",
  "uvicorn>=0.34.0",
]

[project.scripts]
web-api = "aks_agents.web_api:main"
concierge-agent = "aks_agents.concierge_agent:main"
meal-planner-agent = "aks_agents.meal_planner_agent:main"
availability-agent = "aks_agents.availability_agent:main"
inventory-mcp = "aks_agents.inventory_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aks_agents"]
