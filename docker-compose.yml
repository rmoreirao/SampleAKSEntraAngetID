services:
  web-api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: web-api
    environment: &local-env
      APP_DEVELOPMENT_MODE: "true"
      APP_AUTH_LOCAL_DEV_BYPASS: "true"
      APP_RETRIEVAL_MODE: local
      APP_DATA_DIRECTORY: /app/data
      APP_FOUNDRY_ENABLED: "false"
      APP_AGENT_TRANSPORT: local
    ports: ["8000:8000"]
  meal-planner:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: meal-planner-agent
    environment: *local-env
    ports: ["8002:8002"]
  availability:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: availability-agent
    environment: *local-env
    ports: ["8003:8003"]
  inventory-mcp:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: inventory-mcp
    environment: *local-env
    ports: ["8004:8004"]
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["8080:8080"]
    depends_on: [web-api]
