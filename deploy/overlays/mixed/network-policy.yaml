apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-api-ingress
spec:
  podSelector:
    matchLabels:
      app: web-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8000
